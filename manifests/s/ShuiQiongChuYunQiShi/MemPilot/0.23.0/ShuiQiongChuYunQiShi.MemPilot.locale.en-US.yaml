Moniker: mempilot
ShortDescription: Windows memory and process pilot with a measured lease API for AI tasks.
Description: >-
  MemPilot watches both physical memory and commit charge, decides which processes are
  genuinely idle, and reclaims memory only through reversible actions. AI tasks can
  request a memory lease over a local HTTP API before loading a model and release it
  afterwards; the response reports what was actually freed, not what was promised.
  Safety boundaries are enforced in code: force-kill is never automatic, unidentified
  processes are never touched, and every action is written to an audit trail.
