Moniker: mempilot
ShortDescription: Windows memory and process pilot with a measured lease API, an MCP server, and a lease-run CLI for AI tasks.
Description: >-
  MemPilot watches both physical memory and commit charge, decides which processes are
  genuinely idle, and reclaims memory only through reversible actions. AI tasks can reserve
  memory before loading a model — with `mempilot lease run --gb N -- <command>`, over MCP, or
  automatically when a session starts — and the response reports what was actually freed, not
  what was promised. Low-memory response trims a small number of processes first, asks before
  doing more, and explains what it did and why. Safety boundaries are enforced in code:
  force-kill is never automatic, unidentified processes are never touched, and neither
  automatic trimming nor leases ever touch the caller or system-level processes.
