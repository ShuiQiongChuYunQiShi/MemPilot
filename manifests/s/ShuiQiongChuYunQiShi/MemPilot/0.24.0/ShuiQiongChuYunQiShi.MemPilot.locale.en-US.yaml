Moniker: mempilot
ShortDescription: Windows memory and process pilot with a measured lease API and an MCP server for AI tasks.
Description: >-
  MemPilot watches both physical memory and commit charge, decides which processes are
  genuinely idle, and reclaims memory only through reversible actions. AI tasks can request
  a memory lease over a local HTTP API or MCP before loading a model and release it
  afterwards; the response reports what was actually freed, not what was promised. When
  memory runs low it trims a small number of processes first and asks before doing more,
  and it explains what it did and why. Safety boundaries are enforced in code: force-kill is
  never automatic, unidentified processes are never touched, and every action is audited.
