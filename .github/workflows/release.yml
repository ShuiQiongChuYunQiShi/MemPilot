name: release

# Publishing is EXPLICITLY gated: this workflow only runs via workflow_dispatch
# (manual trigger or `gh workflow run release --ref <tag>` from
# tools/publish-release.ps1 after its interactive confirmation).
# Tag pushes alone must never publish — a gate with a bypass is not a gate.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        shell: pwsh
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$env:VERSION"

      # 锁文件门禁：发布必须与仓库锁定的依赖版本一致
      - name: Restore (locked)
        run: dotnet restore tests/MemPilot.Tests/MemPilot.Tests.csproj --locked-mode

      - name: Test gate (release blocked by failing tests)
        run: dotnet test tests/MemPilot.Tests/MemPilot.Tests.csproj -v q

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diag-${{ github.run_id }}
          path: .test-tmp/enumeration-diag.txt
          if-no-files-found: ignore


      - name: Publish portable (framework-dependent, needs .NET 10 Desktop Runtime)
        run: dotnet publish src/MemPilot.App/MemPilot.App.csproj -c Release -o dist/portable -v q

      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path dist/portable/* -DestinationPath "dist/MemPilot-$env:VERSION-portable.zip"

      - name: Publish self-contained single exe
        # v0.13.0 两次实测教训：
        # ① SatelliteResourceLanguages=zh-Hans%3Ben → 启动即崩 0xC000041D（crash.log 来不及写），已移除；
        # ② IncludeNativeLibrariesForSelfExtract 移除也崩同一码——.NET native 组件（hostfxr 等）
        #    在压缩 bundle 里必须靠它解出。两项均保持 v0.12 原状，自包含 62.1MB（65→62，省 3MB）。
        run: dotnet publish src/MemPilot.App/MemPilot.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/single -v q

      - name: Stage single exe
        shell: pwsh
        run: Copy-Item "dist/single/MemPilot.exe" "dist/MemPilot-$env:VERSION-win-x64.exe"

      # 可选签名（默认关闭，仓库变量 SIGN_ENABLED=true 才执行）。
      # 为什么默认关：自签证书只有装到用户信任库才影响 360/SmartScreen；未配置密钥时
      # 直接失败会让发布链红掉，所以这里"未配置=跳过并告警"，与既有发布链兼容。
      # 启用步骤：把 pfx 转 base64 存 secrets.SIGN_PFX_BASE64 + secrets.SIGN_PFX_PASSWORD，
      # 再设仓库变量 SIGN_ENABLED=true。
      - name: Sign artifacts (optional)
        if: ${{ vars.SIGN_ENABLED == 'true' }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Warning 'SIGN_ENABLED=true 但缺少 SIGN_PFX_BASE64，跳过签名'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $signtool) { Write-Warning '未找到 signtool.exe，跳过签名'; exit 0 }
          $targets = @("dist/MemPilot-$env:VERSION-win-x64.exe") + (Get-ChildItem dist/portable -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          foreach ($t in $targets) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $t
          }

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*win-x64.exe' }
          $lines = $files | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name }
          $lines | Set-Content dist/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        run: |
          # NOTE: no array splatting (@assets) — pwsh passes it to native commands as a
          # single joined argument, which gh then glob-matches and fails to find.
          gh release create "$env:GITHUB_REF_NAME" "dist/MemPilot-$env:VERSION-portable.zip" "dist/MemPilot-$env:VERSION-win-x64.exe" "dist/SHA256SUMS.txt" --title "MemPilot $env:VERSION" --generate-notes

      # 未签名说明 + 校验命令写进 Release 正文。
      # 为什么在 create 之后追加而不是 --notes：--generate-notes 的自动 changelog 想保留，
      # 而 --notes 与它会互相覆盖；追加失败只告警，不能影响已经发出去的资产。
      - name: Append unsigned-artifact notice
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $body = gh release view $tag --json body -q .body
          $footer = @"

          ---

          ### 安装前请校验（本包未签名，属预期行为）

          商业代码签名证书年费过高，本项目暂不购买；自签证书只对装了信任根的机器有效，故官方产物**未签名**。
          首次运行被 360 / SmartScreen 拦下是正常的：选择「允许运行」或把 exe 加入信任区即可。

          ``````powershell
          # 与 SHA256SUMS.txt 里的同名行比对，一致即未被改动
          (Get-FileHash ".\MemPilot-${env:VERSION}-win-x64.exe" -Algorithm SHA256).Hash.ToLower()
          ``````
          "@
          if (-not $body) { Write-Warning 'release body 为空，跳过追加'; exit 0 }
          ($body + $footer) | Out-File -FilePath notes.md -Encoding utf8
          gh release edit $tag --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { Write-Warning '追加安装说明失败（不影响已发布资产）' }
          exit 0
