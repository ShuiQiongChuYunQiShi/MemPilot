name: ci

on:
  # 2026-11-15：push 不再触发 CI。
  # 原因：windows-latest 是 2x 计费倍率，每次日常提交都跑一遍 test + coverage 太贵
  # （账号 Actions 额度当日已用到 90%）。
  # 统一为手动 Run workflow；PR 也不再触发（dependabot 的 PR 同样不跑，
  # 合并前需要验证时手动触发一次）。
  # 发版仍只走 release.yml 的 workflow_dispatch，不受影响。
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 锁文件门禁：版本以 packages.lock.json 为准，依赖漂移直接红（棱镜 stack/dependency）
      - name: Restore (locked)
        run: dotnet restore tests/MemPilot.Tests/MemPilot.Tests.csproj --locked-mode

      # 机器可读产物：TRX（真实用例数/结果）+ cobertura（行覆盖）。
      # 为什么必须落盘：xUnit 断言消息会被 CI 日志吞（HANDOFF 关键事实 #5），
      # 而「129 个 Fact/Theory 到底跑了几个」此前只能靠人肉数——用例数不可证 = 假绿风险。
      - name: Test
        run: dotnet test tests/MemPilot.Tests/MemPilot.Tests.csproj -v q --logger "trx;LogFileName=test-results.trx" --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path TestResults -Filter coverage.cobertura.xml -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { Write-Warning '未找到 coverage.cobertura.xml'; exit 0 }
          # Core 行覆盖门槛：v0.18.0 实测 66.5%（新增身份复检/调度/归档用例后），设 60% 锁住现状。
          # 目标 70%（见 ITERATION-BACKLOG）。为什么不设 66：留一次重构的余量，避免正常波动就红。
          $coreGate = 0.60
          $coreRate = $null
          foreach ($f in $files) {
            [xml]$x = Get-Content $f.FullName
            $rate = [double]$x.coverage.'line-rate'
            Write-Host ("coverage {0} line-rate {1:P1}" -f $f.Directory.Name, $rate)
            foreach ($p in $x.coverage.packages.package) {
              if ($p.name -eq 'MemPilot.Core') { $coreRate = [double]$p.'line-rate' }
            }
          }
          if ($null -eq $coreRate) { Write-Warning '未找到 MemPilot.Core 覆盖率条目'; exit 0 }
          Write-Host ("MemPilot.Core line-rate {0:P1} (gate {1:P0})" -f $coreRate, $coreGate)
          if ($coreRate -lt $coreGate) {
            Write-Error ("MemPilot.Core 行覆盖 {0:P1} 低于门槛 {1:P0}" -f $coreRate, $coreGate)
            exit 1
          }
          $trx = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          foreach ($t in $trx) {
            [xml]$d = Get-Content $t.FullName
            $c = $d.TestRun.ResultSummary.Counters
            Write-Host ("trx total={0} passed={1} failed={2} skipped={3}" -f $c.total, $c.passed, $c.failed, $c.notExecuted)
          }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diag-${{ github.run_id }}
          path: .test-tmp/enumeration-diag.txt
          if-no-files-found: ignore

      - name: Build (Release)
        run: dotnet build src/MemPilot.App/MemPilot.App.csproj -c Release -v q
