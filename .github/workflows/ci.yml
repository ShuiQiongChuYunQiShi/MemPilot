name: ci

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/MemoryTool.Tests/MemoryTool.Tests.csproj -v q

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diag-${{ github.run_id }}
          path: .test-tmp/enumeration-diag.txt
          if-no-files-found: ignore


      - name: Build (Release)
        run: dotnet build src/MemoryTool.App/MemoryTool.App.csproj -c Release -v q
